<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cocina</title>
    <link rel="stylesheet" href="Cocinastyle.css">
</head>
<body>

    <h1>Cocina</h1>

    <h2>Productos</h2>

    <input type="text" id="nombre" placeholder="Nombre">
    <input type="number" id="precio" placeholder="Precio">
    <input type="text" id="tipo" placeholder="Tipo">

    <button onclick="agregarProducto()">Agregar</button>
    
<div class="dropdown">

    <button id="btn-menu" class="dropbtn">
        Filtrar
    </button>

    <div id="menu-contenido" class="dropdown-content oculto">

      <a href="#" onclick="mostrarProductos(); return false;">
        Ver todos
    </a>

        <a href="#" onclick="productosCaros(); return false;">
            Productos caros
        </a>

        <a href="#" onclick="productosBaratos(); return false;">
            Productos baratos
        </a>

        <a href="#" onclick="buscarPostres(); return false;">
            Pasteles
        </a>

        <a href="#" onclick="buscarCafes(); return false;">
            Cafés
        </a>

    </div>

</div>

<button onclick="buscarProducto()">
    Buscar producto
</button>

<div id="productos"></div>

    <h2>Pedidos en cocina</h2>

    <button onclick="mostrarPedidos()">Actualizar</button>

    <div id="pedidos"></div>

    <script src="Cocinascript.js"></script>
</body>
</html>
