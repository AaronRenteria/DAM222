<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cliente</title>
    <link rel="stylesheet" href="Clientestyle.css">
</head>
<body>

    <h1>Cafetería - Cliente</h1>

    <h2>Productos</h2>

    <div class="producto">
        <p>Café - $30</p>
        <button onclick="agregarProducto('Café', 30)">Agregar</button>
    </div>

    <div class="producto">
        <p>Capuchino - $40</p>
        <button onclick="agregarProducto('Capuchino', 40)">Agregar</button>
    </div>

    <div class="producto">
        <p>Sandwich - $50</p>
        <button onclick="agregarProducto('Sandwich', 50)">Agregar</button>
    </div>

    <h2>Crear pedido</h2>

    <ul id="pedidoActual"></ul>

    <p>Total: $<span id="total">0</span></p>

    <button onclick="crearPedido()">Hacer pedido</button>
    <button onclick="vaciarPedido()">Eliminar pedido</button>

    <h2>Mis pedidos</h2>

    <div id="listaPedidos"></div>

    <script src="Clientescript.js"></script>

</body>
</html>
