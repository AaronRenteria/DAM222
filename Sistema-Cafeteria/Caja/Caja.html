<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Caja</title>
    <link rel="stylesheet" href="Cajastyle.css">
</head>

<body>

    <h1>Caja</h1>


    <h2>Gestión de productos</h2>

    <input
        type="text"
        id="nombre"
        placeholder="Nombre">

    <input
        type="number"
        id="precio"
        placeholder="Precio">

    <select id="tipo">

        <option value="Bebida">
            Bebida
        </option>

        <option value="Comida">
            Comida
        </option>

        <option value="Postre">
            Postre
        </option>

    </select>

    <button onclick="agregarProducto()">
        Agregar producto
    </button>


    <div id="productos"></div>


    <h2>Lista de pedidos</h2>

    <button onclick="listarPedidos()">
        Actualizar pedidos
    </button>

    <div id="pedidos"></div>


    <h2>Total acumulado</h2>

    <p id="totalAcumulado">
        Total: $0
    </p>


    <script src="Cajascript.js"></script>

</body>

</html>
